name: Temporary AARC Station Cluster CI

on:
  push:
    branches:
      - fix/aarc-station-cluster-fidelity

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Tests
        run: npm test -- --run
      - name: Build Web
        run: npm run build:web
