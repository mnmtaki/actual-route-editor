name: Temp AARC station free
on:
  push:
    branches: [fix/aarc-terrain-geometry-fidelity]
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Apply Station.free preservation
        run: python .github/temp-add-station-free.py
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test -- --run
      - name: Build web
        run: npm run build:web
      - name: Commit validated change and remove temporary CI files
        shell: bash
        run: |
          rm .github/workflows/temp-add-station-free.yml
          rm .github/temp-add-station-free.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve AARC free stations"
          git push origin HEAD:fix/aarc-terrain-geometry-fidelity
