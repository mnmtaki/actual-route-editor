name: Build81.2 presentation

on:
  push:
    branches:
      - feat/operation-history-81

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Apply patch
        run: python scripts/build81_2_presentation.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - name: Commit validated source
        run: |
          rm scripts/build81_2_presentation.py .github/workflows/build81-2-presentation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src dist scripts .github/workflows || true
          git commit -m "Build81.2: align presentation with repeated operation history"
          git push origin HEAD:feat/operation-history-81
