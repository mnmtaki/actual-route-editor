name: Build81 repeated operation history

on:
  push:
    branches: [feat/operation-history-81]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/operation-history-81
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Apply Build81.1 migration
        run: python scripts/build81_repeated_operation_history.py
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build:web
      - name: Commit validated source
        run: |
          rm scripts/build81_repeated_operation_history.py
          rm .github/workflows/build81-repeated-operation-history.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Build81.1: support repeated open and close events"
          git push origin HEAD:feat/operation-history-81
