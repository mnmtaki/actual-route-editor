server:
  port: ${PORT:8080}
  tomcat:
    max-http-form-post-size: 9MB
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/actual_route}
    username: ${DATABASE_USER:actual_route}
    password: ${DATABASE_PASSWORD:}
  servlet:
    multipart:
      max-request-size: 9MB
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
ara:
  cors-origin: ${ARA_CORS_ORIGIN:http://localhost:5173}
  cookie-secure: ${ARA_COOKIE_SECURE:true}
