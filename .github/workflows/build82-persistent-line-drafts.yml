name: Build82 persistent line drafts

on:
  push:
    branches:
      - feat/persistent-line-drafts-82
    paths:
      - scripts/build82_persistent_line_drafts.py
      - .github/workflows/build82-persistent-line-drafts.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Apply patch
        run: python scripts/build82_persistent_line_drafts.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - name: Commit validated source
        run: |
          rm scripts/build82_persistent_line_drafts.py .github/workflows/build82-persistent-line-drafts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src dist scripts .github/workflows || true
          git commit -m "Build82: persist unfinished line drafts"
          git push origin HEAD:feat/persistent-line-drafts-82
