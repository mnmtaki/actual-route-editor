name: Java accounts and cloud saves CI
on:
  push:
    branches:
      - feat/java-accounts-cloud-saves-20261101
  pull_request:
    paths:
      - 'server/**'
      - 'src/**'
      - 'package.json'
jobs:
  java:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: actual_route
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: actual_route
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U actual_route"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/actual_route
      DATABASE_USER: actual_route
      DATABASE_PASSWORD: test-password
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: server/pom.xml
      - run: mvn -B -ntp test package
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
