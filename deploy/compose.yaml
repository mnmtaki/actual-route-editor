name: actual-route-editor
services:
  database:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: actual_route
      POSTGRES_USER: actual_route
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U actual_route -d actual_route"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [internal]

  backend:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/actual_route
      DATABASE_USER: actual_route
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      ARA_CORS_ORIGIN: ${ARA_ORIGIN:-http://localhost:8088}
      ARA_COOKIE_SECURE: ${ARA_COOKIE_SECURE:-false}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    networks: [internal]

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_ARA_API_URL: /
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "${ARA_BIND_ADDRESS:-127.0.0.1}:${ARA_HTTP_PORT:-8088}:80"
    networks: [internal]

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
