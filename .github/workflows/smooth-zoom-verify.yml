name: Smooth zoom verification

on:
  push:
    branches:
      - fix/smooth-wheel-zoom

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run src/renderer/NetworkCanvas.direct.test.tsx src/renderer/NetworkCanvas.coordinate.test.tsx
      - run: npm run build:web
